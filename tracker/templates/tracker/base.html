{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Progressively Enhanced Issue Tracker — a fast, accessible, server-rendered Kanban board with dynamic HTMX enhancements.">
    <title>{% block title %}Issue Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'tracker/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'project_list' %}" class="logo" id="site-logo">
                <span class="logo-icon">◆</span>
                <span class="logo-text">IssueTracker</span>
            </a>
            <nav class="main-nav" id="main-nav">
                <a href="{% url 'project_list' %}" class="nav-link" id="nav-projects">Projects</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 IssueTracker &mdash; Built with Django &amp; HTMX</p>
        </div>
    </footer>

    <!-- HTMX for progressive enhancement -->
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
